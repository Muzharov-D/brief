<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Огонёк · настройка</title>
<link rel="icon" href="/ogonyok.svg">
<style>
:root{--ink:#292C30;--ink2:#3A3E44;--paper:#F4F2EE;--card:#fff;--line:#E4E1DB;--muted:#6E7278;--fire:#F58A2B;--fire2:#FFBC46;--soft:#FFF4E6;--steel:#D5D8DA;--ok:#3F7A58;--bad:#B4442E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);background:#EDEAE4}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:600;margin-right:18px}
.top .brand img{width:28px;height:28px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
.tab.cur{background:var(--ink);color:#fff}
.tab:disabled{opacity:.4;cursor:default}
.main{flex:1;display:flex;min-height:0}
.av{width:40px;height:40px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:10px;font-weight:600;border:0;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #CFCBC4}
.btn.fire{background:var(--fire);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid #BDB8B0;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.chk.on{background:var(--fire);border-color:var(--fire)}
.chk.on:after{content:"";width:9px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sw{width:38px;height:22px;border-radius:11px;background:#CFCBC4;position:relative;flex:none;border:0;cursor:pointer}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ink)}
.sw.on:after{left:19px}
input[type=text],input[type=password],input[type=time],input[type=url]{height:42px;border:1px solid #CFCBC4;border-radius:10px;padding:0 12px;background:#fff;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--fire);outline-offset:1px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #CFCBC4;border-top-color:var(--fire);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* А: разговор */
.a-side{width:250px;background:#EDEAE4;border-right:1px solid var(--line);padding:26px 22px;flex:none;overflow:auto}
.a-side h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px;letter-spacing:.2px}
.a-st{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;color:var(--muted);cursor:default}
.a-st i{width:8px;height:8px;border-radius:50%;background:#CFCBC4;flex:none}
.a-st.done{color:var(--ink);cursor:pointer} .a-st.done i{background:var(--ink)}
.a-st.cur{color:var(--ink);font-weight:600} .a-st.cur i{background:var(--fire);box-shadow:0 0 0 4px rgba(245,138,43,.18)}
.a-side .safe{margin-top:26px;padding:14px;border-radius:10px;background:#fff;font-size:13px;line-height:1.45;color:var(--ink2)}
.a-chat{flex:1;display:flex;flex-direction:column;min-width:0}
.a-log{flex:1;padding:28px 48px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.a-row{display:flex;gap:12px;align-items:flex-start;max-width:780px}
.a-b{background:#fff;border-radius:4px 14px 14px 14px;padding:14px 18px;line-height:1.5;box-shadow:0 1px 0 rgba(0,0,0,.03);min-width:0}
.a-b b{font-weight:600}
.a-me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:14px 4px 14px 14px;padding:11px 16px;max-width:520px}
.a-old{opacity:.55}
.a-fl{display:flex;flex-direction:column;gap:2px;margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.a-f{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;border-radius:8px;border:0;background:transparent;text-align:left;width:100%}
.a-f:hover{background:#F7F5F1}
.a-f .n{margin-left:auto;font-size:13px;color:var(--muted)}
.a-why{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}
.a-why b{color:var(--ink);font-weight:600}
.a-in{padding:16px 48px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);background:#F7F5F1}
.a-in .q{font-size:13px;color:var(--muted);margin-left:auto;max-width:360px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;text-align:left;padding:12px 14px;border:1px solid #D9D5CE;border-radius:10px;background:#fff;cursor:pointer;align-items:flex-start}
.opt.on{border-color:var(--fire);background:var(--soft)}
.opt .t{font-weight:600}
.opt .d{font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}
.cando{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin-top:12px}
.li{font-size:13px;line-height:1.45;margin-top:6px;padding-left:16px;position:relative}
.li:before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.li.no:before{background:#B9B4AC}
.form{display:grid;gap:10px;margin-top:12px;max-width:520px}
.form label{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border-radius:8px;background:#EFECE6;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.sched{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.sr{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sr .w{flex:1;min-width:0}
.sr .w small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.doc{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.doc div{font-size:14px;line-height:1.4}
.rep{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rep .lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-top:8px}
.rep .msg{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;max-height:50vh;overflow:auto}
.rep .li{font-size:14px;line-height:1.45}
.rep details summary{cursor:pointer;font-size:14px}
.rep details pre{margin-top:6px;max-height:40vh}
.sr .btn.sm{min-height:32px;padding:0 12px;font-size:13px}
pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:60vh;overflow:auto}

/* Б: доступы */
.b-main{flex:1;padding:24px 28px;display:flex;flex-direction:column;min-width:0;overflow:auto}
.b-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.b-top h2{font-size:22px;font-weight:700}
.b-sub{font-size:14px;color:var(--muted);margin-bottom:18px}
.b-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.b-c{background:#fff;border-radius:12px;padding:16px 16px 14px;border:1px solid var(--line)}
.b-c.big{grid-column:span 2;grid-row:span 2;border:1.5px solid var(--fire)}
.b-c.off{opacity:.7}
.b-h{display:flex;align-items:center;gap:10px;font-weight:600}
.b-h .sw{margin-left:auto}
.b-p{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.b-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.b-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.b-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid #D9D5CE;background:#fff;cursor:pointer}
.b-chip.on{background:var(--soft);border-color:var(--fire);font-weight:600}
.b-side{width:330px;background:var(--ink);color:#fff;padding:26px 24px;flex:none;display:flex;flex-direction:column;overflow:auto}
.b-side .hd{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
.b-side .s{font-size:12px;color:#A9AEB4;margin-top:20px;font-weight:600;letter-spacing:.2px}
.b-side .r{font-size:14px;line-height:1.45;margin-top:8px;color:#E8E9EA}
.b-side .r b{color:var(--fire2);font-weight:600}
.b-side .x{color:#A3A8AE}
.b-side .foot{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:10px}
.b-side .btn.ghost{color:#fff;border-color:#55595F}
.panel{flex:1;padding:26px 32px;overflow:auto;max-width:980px}
.panel h2{font-size:22px;margin-bottom:6px}
/* главная после настройки: сегодня и лента */
.tab[hidden]{display:none}
.h-page{flex:1;overflow:auto;padding:28px 32px 48px}
.h-wrap{max-width:1240px;margin:0 auto}
.h-hd{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.h-hd h1{font-size:22px;font-weight:600}
.h-st{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mono{font:12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.h-dot{width:8px;height:8px;border-radius:50%;flex:none;background:#CFCBC4;display:inline-block}
.h-dot.lit{background:var(--fire);box-shadow:0 0 0 3px rgba(245,138,43,.18)}
.h-dot.wait{background:var(--fire2)}
.h-dot.out{background:var(--bad)}
.h-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px}
.h-ag{background:#fff;padding:12px 14px;min-width:0}
.h-ag.off{background:#FAF9F7}
.h-ag.off .n{color:var(--muted)}
.h-ag .n{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;min-width:0}
.h-ag .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-ag .mono{display:block;margin-top:4px;white-space:nowrap}
.h-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.h-big{background:#fff;border:1px solid var(--line);border-top:3px solid var(--fire);border-radius:16px;padding:28px 32px}
.h-big.empty{border-top-color:var(--line)}
.h-big.empty .note{margin-top:8px;max-width:560px}
.h-big .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px}
.h-big .who img{width:24px;height:24px}
.h-big .who .mono{margin-left:auto}
.h-big h2{font-size:24px;font-weight:600;line-height:1.3;margin-bottom:8px}
.h-msg.two{column-count:2;column-gap:32px}
.h-msg h4{font-size:13px;font-weight:600;color:#B85D12;margin:16px 0 6px;break-after:avoid}
.h-msg p,.h-msg li{font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.h-msg p{margin-top:6px;break-inside:avoid}
.h-msg ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.h-msg li{padding-left:16px;position:relative;break-inside:avoid}
.h-msg li:before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:#B9B4AC}
.h-msg b{font-weight:600}
.h-msg a{color:#B85D12}
.h-side h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.h-side h3:not(:first-child){margin-top:24px}
.h-sm{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.h-sm:hover,.h-sm.cur{border-color:var(--fire)}
.h-sm .h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.h-sm .h .mono{margin-left:auto}
.h-sm .t{font-weight:500;font-size:14px;margin-top:6px}
.h-sm .p{font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.h-all{margin-top:8px}
@media (max-width:1100px){.h-grid{grid-template-columns:1fr}.h-msg.two{column-count:1}}
@media (max-width:1100px){.b-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.b-side{width:280px}}
@media (max-width:820px){.a-side{display:none}.main{flex-direction:column}.b-side{width:auto}.b-grid{grid-template-columns:1fr}.b-c.big{grid-column:auto}.a-log,.a-in{padding-left:16px;padding-right:16px}.cando,.b-cols{grid-template-columns:1fr}.top{overflow-x:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><img src="/ogonyok.svg" alt=""><span id="brandName">Огонёк</span></div>
    <button class="tab" data-view="home" hidden>Сегодня</button>
    <button class="tab" data-view="talk">Знакомство</button>
    <button class="tab" data-view="access">Доступы</button>
    <button class="tab" data-view="schedule">Расписание</button>
    <button class="tab" data-view="audit">Журнал</button>
    <button class="tab" data-view="check">Проверка</button>
  </div>
  <div class="main" id="main"></div>
</div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let S = null, view = null, step = 0, log = [];
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// неразрывный пробел после коротких слов, чтобы предлоги не висели в конце строки
const nb = (s) => esc(s).replace(/(^|[\s(«])(в|во|на|с|со|к|ко|о|об|от|до|по|из|за|у|и|а|но|не|ни|для|без|при|про|что|как|это|же|или|их|вы|вам|вас|я|мне|он|она)\s/giu, "$1$2 ");

async function call(name, body = {}) {
  const r = await fetch("/api/" + name, {method: "POST", headers: {"Content-Type": "application/json", "X-Brief-Token": TOKEN}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({error: "сервер мастера не ответил"}));
  if (r.status === 403) throw new Error("Страница открыта без ключа. Запустите настройку заново.");
  return d;
}
setInterval(() => call("ping").catch(() => {}), 60000);  // пока страница открыта, мастер не закрывается сам
async function load() { S = await call("state"); document.getElementById("brandName").textContent = name(); return S; }
const P = () => S.profile;
const name = () => P().assistant_name || "Огонёк";
const conns = () => S.connectors;
const MULTI = ["tasks"];  // эти возможности можно вести сразу в нескольких системах, первая основная
const arr = (v) => Array.isArray(v) ? v : (v ? [v] : []);
const mapped = (cid) => Object.entries(P().connectors || {}).filter(([, v]) => arr(v).includes(cid)).map(([k]) => k);
const isOn = (cid) => mapped(cid).length > 0;
async function save(patch) { const r = await call("save", patch); S.profile = r.profile; return r.profile; }
async function setConn(cid, on) {
  const c = conns()[cid]; if (!c) return;
  const patch = {};
  for (const cap of Object.keys(c.provides)) {
    const cur = arr(P().connectors?.[cap]);
    if (MULTI.includes(cap)) { const nx = on ? (cur.includes(cid) ? cur : [...cur, cid]) : cur.filter(x => x !== cid); patch[cap] = nx.length > 1 ? nx : (nx[0] || null); }
    else patch[cap] = on ? cid : (cur.includes(cid) ? null : undefined);
  }
  Object.keys(patch).forEach(k => patch[k] === undefined && delete patch[k]);
  await save({connectors: patch});
  if (cid === "telegram" && on) S.telegram = await call("tg", {action: "status"});
}
async function waitJob(key, onTick) {
  for (;;) { await new Promise(r => setTimeout(r, 1500)); const j = await call("job", {key}); if (onTick) onTick(j); if (!j.running) return j.result || {}; }
}
function cronHuman(c) {
  if (!c) return "по запросу";
  const m = c.trim().split(/\s+/); if (m.length !== 5) return c;
  const [mi, h, dom, mon, dow] = m; const days = {"1-5": "будни", "*": "каждый день", "0": "воскресенье", "1": "понедельник", "2": "вторник", "3": "среда", "4": "четверг", "5": "пятница", "6": "суббота", "0,6": "выходные", "6,0": "выходные"};
  if (/^\d+$/.test(mi) && /^\d+$/.test(h) && dom === "*" && mon === "*" && days[dow]) return `${days[dow]} ${h.padStart(2, "0")}:${mi.padStart(2, "0")}`;
  const ev = mi.match(/^\*\/(\d+)$/); const hr = h.match(/^(\d+)-(\d+)$/);
  if (ev && hr && dom === "*" && mon === "*") return `каждые ${ev[1]} мин с ${hr[1]} до ${hr[2]}${days[dow] && dow !== "*" ? ", " + days[dow] : ""}`;
  if (/^\d+$/.test(mi) && hr && dom === "*" && mon === "*") return `каждый час в :${mi.padStart(2, "0")} с ${hr[1]} до ${hr[2]}${days[dow] && dow !== "*" ? ", " + days[dow] : ""}`;
  if (ev && h === "*") return `каждые ${ev[1]} мин`;
  return c;
}
const simpleCron = (c) => /^\d+ \d+ \* \* [\d,\-*]+$/.test(c || "");

/* ---------- куда уходят данные (общий текст для обоих режимов) ---------- */
function where(rt) {
  rt = rt || P().runtime || {kind: "codex"};
  if (rt.kind === "claude") return {short: "Claude", to: "уходит в <b>Anthropic (подписка Claude)</b>", text: "Текст писем и чатов на время разбора уходит в <b>Anthropic (подписка Claude)</b>. Хранится только у вас: ключи, журнал, брифинги."};
  if (rt.kind === "codex") return {short: "ChatGPT", to: "уходит в <b>OpenAI (подписка ChatGPT)</b>", text: "Текст писем и чатов на время разбора уходит в <b>OpenAI (подписка ChatGPT)</b>. Хранится только у вас: ключи, журнал, брифинги."};
  const host = (rt.base_url || "").replace(/^https?:\/\//, "").split(/[/:]/)[0];
  if (["127.0.0.1", "localhost", "::1", ""].includes(host)) return {short: "этот компьютер", to: "никуда не уходит: модель <b>на этом компьютере</b>", text: "Никуда: думает модель <b>на этом компьютере</b>. Ключи и журнал тоже здесь."};
  return {short: "сервер компании", to: `уходит <b>на сервер компании</b> (${esc(host)})`, text: `На <b>сервер модели вашей компании</b> (${esc(host)}). За его пределы, по словам службы безопасности, ничего не уходит.`};
}

/* ---------- А: разговор ---------- */
const STEPS = [
  {t: "Знакомство", f: stIntro}, {t: "Где думает помощник", f: stModel}, {t: "Почта и календарь", f: stMail},
  {t: "Задачи", f: stTasks}, {t: "Telegram", f: stTelegram}, {t: "Созвоны и голосовые", f: stCalls},
  {t: "Когда работать", f: stSchedule}, {t: "Проверка", f: stCheck},
];
function talkShell() {
  const m = document.getElementById("main"); m.innerHTML = "";
  const side = $(`<div class="a-side"><h3>НАСТРОЙКА, ШАГ ${step + 1} ИЗ ${STEPS.length}</h3></div>`);
  STEPS.forEach((s, i) => {
    const el = $(`<div class="a-st ${i < step ? "done" : i === step ? "cur" : ""}"><i></i>${nb(s.t)}</div>`);
    if (i < step) el.onclick = () => { step = i; log = []; renderTalk(); };
    side.appendChild(el);
  });

// в истории оставляем только реплики помощника: формы и списки отвечены ответом пользователя
function remember() {
  document.querySelectorAll("#alog .a-row:not(.a-old)").forEach(r => {

  });

// Запасная модель: если основная не ответит (кончился лимит, сбой), тот же агент идёт через неё.
// Только то, что уже работает на компьютере, и только по выбору владельца: данные в этот раз уйдут туда.
function askFallback(main, m, label) {
  const isLocal = !["claude", "codex"].includes(main.kind) && /127\.0\.0\.1|localhost/.test(main.base_url || "");
  const c = [];
  if (main.kind !== "claude" && m.claude?.logged_in) c.push({rt: {kind: "claude"}, t: "Подписка Claude", d: "Только если основная не ответит. В этот раз текст писем и чатов уйдёт в Anthropic."});
  if (main.kind !== "codex" && m.codex?.logged_in) c.push({rt: {kind: "codex"}, t: "Подписка ChatGPT", d: "Только если основная не ответит. В этот раз текст писем и чатов уйдёт в OpenAI."});
  if (!isLocal && m.local?.length) { const x = m.local[0]; c.push({rt: {kind: x.kind, model: x.model, base_url: x.base_url, num_ctx: 32768}, t: `На этом компьютере: ${x.model}`, d: "Ничего никуда не уходит, но разбор будет проще."}); }
  if (!c.length) { save({fallback_runtime: null}).then(() => next(label)); return; }
  remember(); me(label);
  const cur = P().fallback_runtime; let pick = c.findIndex(x => cur && x.rt.kind === cur.kind && (x.rt.model || "") === (cur.model || ""));
  const list = $(`<div class="opts"></div>`);
  const paint = () => { list.innerHTML = ""; [{t: "Без запасной", d: "Если основная не ответит, повторю через 20 и 40 минут, а утром пришлю сводку без разбора: встречи, задачи, сколько писем и чатов ждёт."}, ...c].forEach((x, i) => { const on = pick === i - 1; const b = $(`<button class="opt ${on ? "on" : ""}"><span class="chk ${on ? "on" : ""}"></span><span><div class="t">${nb(x.t)}</div><div class="d">${nb(x.d)}</div></span></button>`); b.onclick = () => { pick = i - 1; paint(); }; list.appendChild(b); }); };
  paint();
  say(nb("Если основная модель не ответит (кончился лимит подписки, сбой у сервиса), можно сразу взять запасную. Иначе я повторю попытку позже."), list);
  input(button("Дальше", "", async () => {
    const fb = pick >= 0 ? c[pick] : null;
    await save({fallback_runtime: fb ? fb.rt : null});
    next(fb ? `Запасная: ${fb.t}` : "Без запасной");
  }));
}

function botStep() {

  const paint = () => {
    list.innerHTML = "";
    f.folders.forEach(x => { const b = $(`<button class="a-f"><span class="chk ${sel.has(x.title) ? "on" : ""}"></span>${esc(x.title)}<span class="n">${x.chats} ${plural(x.chats)}${x.categories.length ? " + " + esc(x.categories.join(", ")) : ""}</span></button>`); b.onclick = () => { sel.has(x.title) ? sel.delete(x.title) : sel.add(x.title); paint(); saveBtn.innerHTML = label(); saveBtn.disabled = !sel.size; }; list.appendChild(b); });

// opts.switches: показывать переключатели; opts.trial(a, btn): кнопка пробного прогона в строке
function scheduleList(onChange, opts = {}) {
  const box = $(`<div class="sched"></div>`);
  const agents = S.agents;
  const conf = Object.assign({}, P().agents || {});
  agents.forEach(a => {
    const c = conf[a.id] || {}; const on = c.on ?? a.on; let cron = c.schedule ?? a.schedule;
    const tried = a.tried ? ` · проба ${fmtAt(a.tried.at)}${a.tried.ok ? "" : ", с ошибкой"}` : "";
    const sub = () => nb(cronHuman(cron)) + (a.source === "свой" ? " · свой агент" : "") + (opts.trial ? tried : "");
    const row = $(`<div class="sr">${opts.switches === false ? "" : `<button class="sw ${on ? "on" : ""}" aria-label="включить"></button>`}<div class="w">${nb(a.title)}<small>${sub()}</small></div></div>`);
    if (simpleCron(cron)) {
      const [mi, h] = cron.split(" "); const t = $(`<input type="time" value="${h.padStart(2, "0")}:${mi.padStart(2, "0")}">`);
      t.onchange = () => { const [hh, mm] = t.value.split(":"); const parts = cron.split(" "); parts[0] = String(+mm); parts[1] = String(+hh); cron = parts.join(" "); conf[a.id] = Object.assign({}, conf[a.id], {schedule: cron}); row.querySelector("small").innerHTML = sub(); onChange(conf, a.id, {schedule: cron}); };
      row.appendChild(t);
    }
    if (opts.trial) { const b = button("Пробно", "ghost sm", () => opts.trial(a, b)); row.appendChild(b); }
    const sw = row.querySelector(".sw");
    if (sw) sw.onclick = (e) => { const v = !e.target.classList.contains("on"); e.target.classList.toggle("on", v); conf[a.id] = Object.assign({}, conf[a.id], {on: v}); onChange(conf, a.id, {on: v}); };
    box.appendChild(row);
  });
  return box;
}
function fmtAt(iso) { const d = new Date(iso); return isNaN(d) ? "" : `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

/* ---------- пробный прогон: ничего не отправляет и не меняет, показывает, что сделал бы ---------- */
async function trialRun(agent, onTick) {
  const k = (await call("trial", {agent})).started; const t0 = Date.now();
  await waitJob(k, () => onTick && onTick(Math.round((Date.now() - t0) / 1000)));
  return (await call("trial_report", {agent})).report;
}
function itemsOf(c) { return !c ? [] : Array.isArray(c) ? c : Array.isArray(c.items) ? c.items : [c]; }
function actLine(a) {
  const sub = (a.args || [])[0] || ""; const its = itemsOf(a.content);
  const names = its.map(i => typeof i === "string" ? i : (i.title || i.subject || i.name || i.text || "")).filter(Boolean);
  const list = names.length ? ": " + names.slice(0, 8).join("; ") + (names.length > 8 ? ` и ещё ${names.length - 8}` : "") : "";
  if (a.cap === "tasks") return ({add: "Добавил бы задачи", complete: "Закрыл бы задачи", retime: "Перенёс бы задачи", confirm: "Подтвердил бы предложенные задачи", reject: "Отклонил бы предложенные задачи"}[sub] || "Задачи, " + sub) + list;
  if (a.cap === "draft") return "Сохранил бы черновик письма" + (its.length ? ": " + its.map(i => `«${i.subject || "без темы"}»${i.to ? ", кому: " + [].concat(i.to).join(", ") : ""}`).join("; ") : "");
  if (a.cap === "tg" && sub === "draft") return "Положил бы черновик ответа в Telegram" + list;
  return `${a.cap} ${sub}`;
}
function reportView(r) {
  const box = $(`<div class="rep"></div>`);
  if (!r) { box.append($(`<div class="bad">${nb("Отчёта нет: пробный прогон не дошёл до конца. Подробности во вкладке «Журнал действий».")}</div>`)); return box; }
  const isMsg = a => a.cap === "tg" && (a.args || [])[0] === "notify";
  const msgs = r.actions.filter(isMsg), other = r.actions.filter(a => !isMsg(a));
  box.append($(`<div class="${r.ok ? "" : "bad"}">${nb(r.ok ? `Пробный прогон «${r.title}» готов (${fmtAt(r.at)}). Ничего не отправлено и не изменено.` : `«${r.title}» не отработал. Что случилось:`)}</div>`));
  if (!r.ok) box.append($(`<pre>${esc(r.answer || "")}</pre>`));
  msgs.forEach(a => { const t = typeof a.content === "string" ? a.content : JSON.stringify(a.content || "", null, 1); box.append($(`<div class="lbl">${nb("ПРИШЛО БЫ ВАМ В БОТА")}</div>`), $(`<div class="msg">${esc(t.replace(/<[^>]+>/g, ""))}</div>`)); });
  if (other.length) { box.append($(`<div class="lbl">${nb("СДЕЛАЛ БЫ")}</div>`)); other.forEach(a => box.append($(`<div class="li">${esc(actLine(a))}</div>`))); }
  if (r.files.length) {
    box.append($(`<div class="lbl">${nb("ЗАПИСАЛ БЫ В ПАПКУ")}</div>`));
    r.files.forEach(f => box.append($(`<details><summary>${esc(f.path)} <span class="muted">${f.new ? "новый" : "изменён"}</span></summary>${f.text ? `<pre>${esc(f.text)}</pre>` : ""}</details>`)));
  }
  if (r.ok && !r.actions.length && !r.files.length) box.append($(`<div class="muted">${nb("Ничего бы не отправил и не записал: нового для этого агента сейчас нет.")}</div>`));
  return box;
}

    card.querySelector(".sw").onclick = async () => {
      await setConn(id, !on);
      if (!on && id === "bitrix24") { step = 3; log = []; return renderTalk(); }
      renderAccess();
    };
    grid.appendChild(card);
  });
  paintSide(side, (S.telegram || {}).folders || []);
}
async function loadChips(el, side) {
  const f = await call("tg", {action: "folders"});
  el.innerHTML = "";
  if (f.error) { el.appendChild($(`<span class="note bad">${nb(f.error)}</span>`)); return; }
  const sel = new Set(f.selected);
  f.folders.forEach(x => {
    const b = $(`<button class="b-chip ${sel.has(x.title) ? "on" : ""}">${esc(x.title)} <span class="muted" style="font-weight:400">${x.chats}</span></button>`);
    b.onclick = async () => {
      const n = new Set(sel); n.has(x.title) ? n.delete(x.title) : n.add(x.title);
      if (!n.size) { alert("Должна остаться хотя бы одна папка. Чтобы закрыть Telegram совсем, выключите карточку."); return; }
      const r = await call("tg", {action: "save_folders", folders: [...n]});
      if (r.error) return alert(r.error);
      sel.clear(); n.forEach(v => sel.add(v)); b.classList.toggle("on"); S.telegram.folders = [...sel]; paintSide(side, [...sel]);
    };
    el.appendChild(b);
  });
  S.telegram = Object.assign({}, S.telegram, {folders: f.selected});
  paintSide(side, f.selected);
}
function paintSide(side, folders) {
  const on = Object.keys(conns()).filter(isOn), off = Object.keys(conns()).filter(id => !isOn(id));
  const seen = on.filter(id => id !== "telegram").map(id => conns()[id].title);
  const reading = on.includes("telegram") && (S.telegram || {}).reading;
  if (reading) seen.push(`<b>${folders.length} ${folders.length === 1 ? "папку" : folders.length < 5 ? "папки" : "папок"} Telegram</b>: ${folders.map(esc).join(", ")}`);
  side.innerHTML = "";
  side.append($(`<div class="hd"><img class="av" src="/ogonyok.svg" alt="">${nb("Что увидит " + name())}</div>`),
    $(`<div class="s">ВИДИТ</div>`), $(`<div class="r">${seen.length ? seen.map(x => x.startsWith("<b>") ? x : nb(x)).join(". ") + "." : nb("Пока ничего не подключено.")}</div>`),
    $(`<div class="s">НЕ ВИДИТ</div>`), $(`<div class="r x">${nb((reading ? "Чаты вне выбранных папок. Непрочитанные вами сообщения. " : on.includes("telegram") ? "Ваши чаты Telegram: их чтение не подключено. " : "Telegram. ") + (off.filter(i => i !== "telegram").length ? off.filter(i => i !== "telegram").map(i => conns()[i].title).join(", ") + " (выключено)." : ""))}</div>`),
    $(`<div class="s">КУДА УХОДЯТ ДАННЫЕ</div>`), $(`<div class="r">${where().text}${P().fallback_runtime ? " " + nb("Если основная модель не ответит, текст") + " " + where(P().fallback_runtime).to + "." : ""}</div>`),
    $(`<div class="s">ЧТО ОТПРАВЛЯЕТ</div>`), $(`<div class="r">${nb("Только сообщения вам в ваш бот. Остальное черновики и ссылки: отправляете вы.")}</div>`));
  const foot = $(`<div class="foot"></div>`);
  foot.append(button("Расписание", "fire", () => go("schedule")), button("Журнал действий", "ghost", () => go("audit")));
  side.appendChild(foot);
}

/* ---------- расписание, журнал, проверка ---------- */
function renderSchedule() {
  view = "schedule"; tabs();
  const m = document.getElementById("main"); m.innerHTML = "";
  const p = $(`<div class="panel"><h2>Расписание</h2><div class="b-sub">${nb("Когда помощник работает сам. Включайте агентов по одному: сначала «Пробно» покажет, что агент прислал бы и что сделал бы, ничего не отправляя и не меняя. Агент, который проверяет новое (бот, встречи, созвоны), запускает модель только если есть дело.")}</div></div>`);
  const st = $(`<div class="note" style="margin-top:14px"></div>`);
  const out = $(`<div style="margin-top:14px"></div>`);
  let busy = false;
  const apply = async (conf, id, change) => {
    const a = S.agents.find(x => x.id === id);
    st.textContent = "Сохраняю…";
    const r = await call("enable", {agent: id, ...change});
    const err = r.error || (Array.isArray(r) ? (r.find(x => x.error) || {}).error : null);
    st.innerHTML = err ? `<span class="bad">${nb(err)}</span>` : nb(`«${a.title}» ${"on" in change ? (change.on ? "включён" : "выключен") : "по новому времени"}. Включены: ${(Array.isArray(r) ? r.filter(x => x.agent).map(x => x.title) : []).join(", ") || "никто"}.`);
    await load();
  };
  const trial = async (a, b) => {
    if (busy) { st.textContent = "Дождитесь конца текущего пробного прогона."; return; }
    busy = true; b.disabled = true; out.innerHTML = "";
    const w = $(`<div class="note"><span class="spin"></span>${nb(`«${a.title}»: пробный прогон, ничего не отправляю и не меняю. Это до нескольких минут.`)}</div>`); out.appendChild(w);
    const r = await trialRun(a.id, s => { w.innerHTML = '<span class="spin"></span>' + nb(`«${a.title}»: пробный прогон, прошло ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}.`); });
    out.innerHTML = ""; out.appendChild(reportView(r)); busy = false; b.disabled = false;
  };
  p.append(scheduleList(apply, {trial}), st, out);
  m.appendChild(p);
}
async function renderAudit() {
  view = "audit"; tabs();
  const m = document.getElementById("main"); m.innerHTML = "";
  const p = $(`<div class="panel"><h2>Журнал действий</h2><div class="b-sub">${nb("Что помощник читал и что делал, по каждому шагу. Содержимое писем и чатов в журнал не пишется, только что и сколько. Журнал лежит на этом компьютере в ~/.brief/audit.")}</div><div style="margin-bottom:12px"><span class="seg" id="dd"><button data-d="1" class="on">сегодня</button><button data-d="7">неделя</button></span></div><pre id="au">загружаю…</pre></div>`);
  m.appendChild(p);
  const show = async (d) => { p.querySelectorAll("#dd button").forEach(b => b.classList.toggle("on", b.dataset.d == d)); const r = await call("audit", {days: d}); p.querySelector("#au").textContent = r.text || r.error || ""; };
  p.querySelectorAll("#dd button").forEach(b => b.onclick = () => show(b.dataset.d)); show(1);
}
function renderCheck() { step = STEPS.length - 1; log = []; renderTalk(); view = "check"; tabs(); }

/* ---------- главная после настройки: сегодня и лента того, что ушло в Telegram ---------- */
const DAYS = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hm = (iso) => (iso || "").slice(11, 16);
function dayTitle(iso, cap) {
  const d = new Date(iso.slice(0, 10) + "T12:00"), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  const s = ymd(d) === ymd(t) ? "сегодня" : ymd(d) === ymd(y) ? "вчера" : `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return cap ? s[0].toUpperCase() + s.slice(1) : s;
}
function when(iso) {  // «в 18:00», «завтра в 08:00», «пт в 18:45»
  if (!iso) return "";
  const d = new Date(iso), t = new Date(), tm = new Date(); tm.setDate(t.getDate() + 1);
  const short = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"][d.getDay()];
  return (ymd(d) === ymd(t) ? "" : ymd(d) === ymd(tm) ? "завтра " : short + " ") + "в " + hm(iso);
}
// текст сообщения в разметке Telegram: оставляем только <b>, <i> и ссылки http(s), остальное как текст
function tgSafe(line) {
  return esc(line).replace(/&lt;(\/?)(b|i)&gt;/g, "<$1$2>")
    .replace(/&lt;a href=&quot;(https?:\/\/[^"&]+?)&quot;&gt;(.*?)&lt;\/a&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>');
}
const plain = (s) => s.replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").trim();
function msgParts(text) {
  const lines = text.split("\n");
  const i = lines.findIndex(l => plain(l));
  return {title: plain(lines[i] || ""), body: lines.slice(i + 1)};
}
function msgHtml(lines) {  // строка целиком жирным: заголовок раздела; «- » или «• »: пункт списка
  let h = "", list = false;
  const close = () => { if (list) { h += "</ul>"; list = false; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    if (/^<b>[^<]*<\/b>:?$/.test(l)) { close(); h += `<h4>${tgSafe(plain(l).replace(/:$/, ""))}</h4>`; continue; }
    const li = l.match(/^(?:[-•·*]|\d+[.)])\s+(.*)$/);
    if (li) { if (!list) { h += "<ul>"; list = true; } h += `<li>${tgSafe(li[1])}</li>`; continue; }
    close(); h += `<p>${tgSafe(l)}</p>`;
  }
  close(); return h;
}
const preview = (lines) => plain(lines.filter(l => plain(l)).slice(0, 4).map(l => plain(l).replace(/^(?:[-•·*]|\d+[.)])\s+/, "")).join(". ")).slice(0, 220);
let FEED = null;
async function renderHome(all) {
  view = "home"; tabs();
  const m = document.getElementById("main"); m.innerHTML = `<div class="h-page"><div class="h-wrap"><p class="note"><span class="spin"></span>загружаю…</p></div></div>`;
  FEED = await call("feed", {days: all ? 30 : 7});
  const titles = Object.fromEntries(FEED.agents.map(a => [a.id, a.title]));
  const who = (r) => r.kind === "сводка" ? "Сводка без модели" : r.kind === "сбой" ? (titles[r.agent] || name()) + ": сбой" : titles[r.agent] || name();
  const today = ymd(new Date());
  const items = FEED.items.map(r => ({...r, ...msgParts(r.text), day: r.at.slice(0, 10)}));
  const todays = items.filter(r => r.day === today);
  // главное сообщение дня: утренний брифинг (или его сводка), иначе самое длинное из сегодняшних
  const main = todays.find(r => r.agent === "morning-briefing") || [...todays].sort((a, b) => b.text.length - a.text.length)[0];
  const dot = (a) => !a.on ? "" : a.last && a.last.at.slice(0, 10) === today ? (a.last.ok ? "lit" : "out") : "wait";
  const agentRow = (a) => `<div class="h-ag ${a.on ? "" : "off"}"><div class="n"><i class="h-dot ${dot(a)}"></i><span>${esc(a.title)}</span></div>
    <span class="mono">${!a.on ? "выключен" : a.last && a.last.at.slice(0, 10) === today ? (a.last.ok ? "был " : "сбой ") + hm(a.last.at) : "сегодня не был"}</span>
    <span class="mono">${a.on && a.next ? "дальше " + when(a.next) : "&nbsp;"}</span></div>`;
  const card = (r) => `<button class="h-sm ${r === main ? "cur" : ""}" data-at="${esc(r.at)}"><div class="h"><i class="h-dot ${r.kind === "сбой" ? "out" : "lit"}"></i>${esc(who(r))}<span class="mono">${hm(r.at)}</span></div>
    <div class="t">${esc(r.title)}</div><div class="p">${esc(preview(r.body))}</div></button>`;
  let side = "", lastDay = null;
  items.forEach(r => {
    const head = r.day === today ? "Сегодня" : dayTitle(r.at, true);
    if (head !== lastDay) { side += `<h3>${esc(head)}</h3>`; lastDay = head; }
    side += card(r);
  });
  const big = main ? `<article class="h-big"><div class="who"><img src="/ogonyok.svg" alt="">${esc(who(main))}<span class="mono">${hm(main.at)}</span></div>
      <h2>${esc(main.title)}</h2><div class="h-msg ${main.body.length > 18 ? "two" : ""}">${msgHtml(main.body)}</div></article>`
    : `<article class="h-big empty"><h2>${nb("Сегодня в Telegram ещё ничего не уходило")}</h2>
      <p class="note">${nb("Всё, что помощник присылает вам в бота, появляется здесь: брифинги, протоколы созвонов, подготовка к встречам, ответы. Копия хранится только на этом компьютере 30 дней.")}</p></article>`;
  const d = new Date(), sent = todays.length;
  const n = sent % 10 === 1 && sent % 100 !== 11 ? "сообщение" : [2, 3, 4].includes(sent % 10) && ![12, 13, 14].includes(sent % 100) ? "сообщения" : "сообщений";
  m.innerHTML = `<div class="h-page"><div class="h-wrap">
    <div class="h-hd"><h1>${DAYS[d.getDay()][0].toUpperCase() + DAYS[d.getDay()].slice(1)}, ${d.getDate()} ${MONTHS[d.getMonth()]}</h1>
      <span class="muted">${sent ? `${sent} ${n} сегодня, всё ушло в Telegram` : "сегодня сообщений не было"}</span>
      <span class="h-st"><i class="h-dot ${FEED.schedule ? "lit" : "out"}"></i>${FEED.schedule ? "Работает по расписанию" : nb("Расписание выключено: вкладка «Расписание»")}</span></div>
    <div class="h-strip">${FEED.agents.map(agentRow).join("")}</div>
    <div class="h-grid"><div id="hbig">${big}</div><div class="h-side">${side || `<p class="note">${nb("Других сообщений за неделю нет.")}</p>`}
      ${all ? "" : `<button class="btn ghost h-all">${nb("Вся лента за 30 дней")}</button>`}</div></div></div></div>`;
  const all30 = m.querySelector(".h-all"); if (all30) all30.onclick = () => renderHome(true);
  m.querySelectorAll(".h-sm").forEach(b => b.onclick = () => {  // открыть сообщение крупно на месте главного
    const r = items.find(x => x.at === b.dataset.at && b.querySelector(".t").textContent === x.title); if (!r) return;
    m.querySelectorAll(".h-sm").forEach(x => x.classList.toggle("cur", x === b));
    document.getElementById("hbig").innerHTML = `<article class="h-big"><div class="who"><img src="/ogonyok.svg" alt="">${esc(who(r))}<span class="mono">${esc(dayTitle(r.at))}, ${hm(r.at)}</span></div>
      <h2>${esc(r.title)}</h2><div class="h-msg ${r.body.length > 18 ? "two" : ""}">${msgHtml(r.body)}</div></article>`;
    document.getElementById("hbig").scrollIntoView({block: "nearest", behavior: "smooth"});
  });
}

function tabs() {
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("cur", t.dataset.view === view);
    t.disabled = !P().setup_done && t.dataset.view !== "talk";
    // после настройки «Знакомство» не нужно: вместо него «Сегодня»; до настройки наоборот
    t.hidden = P().setup_done ? t.dataset.view === "talk" : t.dataset.view === "home";
  });
}
function go(v) { location.hash = v; }
function route() {
  const v = location.hash.slice(1) || (P().setup_done ? "home" : "talk");
  if (!P().setup_done && v !== "talk") return renderTalk();
  ({home: () => renderHome(false), talk: () => { step = P().setup_done ? 0 : (P().setup_step || 0); log = []; renderTalk(); }, access: renderAccess, tgread: () => renderTgRead("access"), schedule: renderSchedule, audit: renderAudit, check: renderCheck}[v] || (() => renderHome(false)))();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { if (location.hash.slice(1) === t.dataset.view) route(); else go(t.dataset.view); });
window.onhashchange = route;
load().then(route).catch(e => { document.getElementById("main").innerHTML = `<div class="panel"><h2>Не открылось</h2><p class="note">${esc(e.message)}</p></div>`; });
</script>
